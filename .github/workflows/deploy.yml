name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go mod tidy
          go build ./...

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment examples
        run: |
          sh -n infra/localstack/init.sh
          docker compose config --quiet
      - name: Compose smoke test
        run: |
          docker compose up --build --wait -d
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          for i in 1 2; do
            docker compose exec -T localstack awslocal sns publish \
              --topic-arn arn:aws:sns:us-east-1:000000000000:example-events \
              --message '{"event_id":"ci-smoke-1","type":"order.created","occurred_at":"2026-09-28T20:00:00Z","data":{"order_id":"ci-1"}}'
          done
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T mongo mongosh --quiet events \
              --eval 'db.ingested_events.countDocuments({_id:"ci-smoke-1"})' | tr -d '\r')
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs consumer localstack
          exit 1
      - name: Diagnose Compose startup
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color localstack consumer
          docker compose exec -T localstack sh -c 'curl -s http://localhost:4566/_localstack/init/ready || true'
      - name: Stop Compose
        if: always()
        run: docker compose down -v

  image:
    needs: [compile, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
