name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go mod tidy
          go build ./...

  integration:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment examples
        run: |
          sh -n infra/localstack/init.sh
          docker compose config --quiet
      - name: Compose smoke test
        run: |
          docker compose up --build --wait -d
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          for i in 1 2; do
            docker compose exec -T localstack awslocal sns publish \
              --topic-arn arn:aws:sns:us-east-1:000000000000:example-events.fifo \
              --message-group-id ci-1 --message-deduplication-id "ci-create-$i" \
              --message '{"event_id":"ci-smoke-1","type":"order.created","occurred_at":"2026-09-28T20:00:00Z","data":{"order_id":"ci-1"}}'
          done
          for attempt in $(seq 1 30); do
            count=$(docker compose exec -T mongo mongosh --quiet events \
              --eval 'db.ingested_events.countDocuments({_id:"ci-smoke-1"})' | tr -d '\r')
            if [ "$count" = "1" ]; then break; fi
            sleep 2
          done
          if [ "$count" != "1" ]; then exit 1; fi
          docker compose exec -T localstack awslocal sns publish \
            --topic-arn arn:aws:sns:us-east-1:000000000000:example-events.fifo \
            --message-group-id ci-1 --message-deduplication-id ci-delete-1 \
            --message '{"event_id":"ci-delete-1","type":"order.deleted","occurred_at":"2026-09-28T20:05:00Z","data":{"order_id":"ci-1"}}'
          for attempt in $(seq 1 30); do
            state=$(docker compose exec -T mongo mongosh --quiet events \
              --eval 'print(db.ingested_events.countDocuments({order_id:"ci-1"}) + ":" + db.ingested_events_deletions.countDocuments({_id:"ci-1"}))' | tr -d '\r')
            if [ "$state" = "0:1" ]; then break; fi
            sleep 2
          done
          if [ "$state" != "0:1" ]; then exit 1; fi
          # A new SNS deduplication ID forces redelivery of the old event body.
          docker compose exec -T localstack awslocal sns publish \
            --topic-arn arn:aws:sns:us-east-1:000000000000:example-events.fifo \
            --message-group-id ci-1 --message-deduplication-id ci-replay-1 \
            --message '{"event_id":"ci-smoke-1","type":"order.created","occurred_at":"2026-09-28T20:00:00Z","data":{"order_id":"ci-1"}}'
          sleep 5
          count=$(docker compose exec -T mongo mongosh --quiet events \
            --eval 'db.ingested_events.countDocuments({order_id:"ci-1"})' | tr -d '\r')
          [ "$count" = "0" ]
      - name: Diagnose Compose startup
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color localstack consumer
          docker compose exec -T localstack sh -c 'curl -s http://localhost:4566/_localstack/init/ready || true'
      - name: Stop Compose
        if: always()
        run: docker compose down -v

  image:
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
