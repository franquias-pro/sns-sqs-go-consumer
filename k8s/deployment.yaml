apiVersion: apps/v1
kind: Deployment
metadata:
  name: sns-sqs-go-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sns-sqs-go-consumer
  template:
    metadata:
      labels:
        app: sns-sqs-go-consumer
    spec:
      serviceAccountName: sns-sqs-go-consumer
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          image: ghcr.io/franquias-pro/sns-sqs-go-consumer:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sns-sqs-go-consumer
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: sns-sqs-go-consumer
                  key: mongo-uri
            - name: ELASTIC_APM_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sns-sqs-go-consumer
                  key: apm-secret-token
                  optional: true
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
