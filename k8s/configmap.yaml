apiVersion: v1
kind: ConfigMap
metadata:
  name: sns-sqs-go-consumer
data:
  AWS_REGION: us-east-1
  SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/123456789012/example-events
  MONGO_DATABASE: events
  MONGO_COLLECTION: ingested_events
  MONGO_MAX_POOL_SIZE: "100"
  HEALTH_ADDR: ":8080"
  POLLERS: "16"
  WORKERS: "200"
  ACKERS: "8"
  PROCESS_TIMEOUT: 15s
  VISIBILITY_TIMEOUT: "120"
  SHUTDOWN_TIMEOUT: 45s
  ELASTIC_APM_SERVICE_NAME: sns-sqs-go-consumer
  ELASTIC_APM_SERVER_URL: http://apm-server.observability.svc.cluster.local:8200
  ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "0.01"
  ELASTIC_APM_METRICS_INTERVAL: 30s
